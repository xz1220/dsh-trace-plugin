[project]
name = "codex-trace-dev"
version = "0.0.0"
description = "Development tools for the zero-dependency Codex Trace plugin"
requires-python = ">=3.9"
dependencies = []

[dependency-groups]
dev = ["coverage>=7.6,<8", "mypy>=1.15,<2", "ruff==0.17.5"]

[tool.uv]
package = false

[tool.ruff]
cache-dir = ".cache/ruff"
target-version = "py39"
line-length = 100
extend-exclude = ["vendor", "local-context", "node_modules"]
exclude = ["plugins/codex-dsh-trace/server/_version.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM"]
ignore = ["SIM105", "SIM117"]

[tool.ruff.lint.per-file-ignores]
# Tests and standalone tools add the unpackaged plugin to sys.path.
"tests/*.py" = ["E402"]
"scripts/*.py" = ["E402"]

[tool.mypy]
cache_dir = ".cache/mypy"
python_version = "3.9"
mypy_path = ["plugins/codex-dsh-trace/server", "packages/dsh-trace-extension/installer"]
files = ["plugins/codex-dsh-trace/server", "packages/dsh-trace-extension/installer"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.coverage.run]
data_file = ".cache/coverage/python/.coverage"
source = ["plugins/codex-dsh-trace/server", "packages/dsh-trace-extension/installer"]
branch = true
omit = ["*/_version.py", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 75
exclude_also = ["if __name__ == .__main__.:" ]

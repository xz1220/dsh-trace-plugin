name: Release plugin

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dist_tag:
        description: 'npm dist-tag for OIDC publish (prerelease tags always use next)'
        required: true
        default: 'next'
        type: choice
        options:
          - next
          - latest

permissions:
  contents: read

jobs:
  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.9.27'
          enable-cache: true
      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const {version} = JSON.parse(readFileSync('package.json', 'utf8'));
          if (process.env.RELEASE_TAG !== `v${version}`) {
            throw new Error('Release tag must match package.json version.');
          }
          JS
      - run: uv sync --frozen --group dev --python 3.13
      - run: npm ci
      - run: npm run check
      - run: npm run test:npm
      - run: npm run package
      - name: Read the reviewed changelog entry
        run: node scripts/release-notes.mjs > dist/RELEASE_NOTES.md
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS --verify-tag --title "Codex Trace $RELEASE_TAG" --notes-file dist/RELEASE_NOTES.md

  publish-npm:
    needs: release
    if: >-
      always() &&
      github.ref_type == 'tag' &&
      (
        (github.event_name == 'push' && needs.release.result == 'success' && vars.ENABLE_NPM_PUBLISH == 'true') ||
        (github.event_name == 'workflow_dispatch' && needs.release.result == 'skipped')
      )
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.9.27'
          enable-cache: true
      - name: Verify release tag and choose dist-tag
        id: meta
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          node --input-type=module <<'JS'
          import {appendFileSync, readFileSync} from 'node:fs';
          const {version} = JSON.parse(readFileSync('package.json', 'utf8'));
          if (process.env.RELEASE_TAG !== `v${version}`) {
            throw new Error('Release tag must match package.json version.');
          }
          const isPrerelease = version.includes('-');
          const requested = process.env.EVENT_NAME === 'workflow_dispatch'
            ? (process.env.INPUT_DIST_TAG || 'next')
            : 'next';
          const distTag = isPrerelease ? 'next' : requested;
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\ndist_tag=${distTag}\n`);
          JS
      - run: uv sync --frozen --group dev --python 3.13
      - run: npm ci
      - run: npm run check
      - run: npm run test:npm
      - run: npm run package:npm
      - name: Pack and publish npm tarball with OIDC provenance
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          DIST_TAG: ${{ steps.meta.outputs.dist_tag }}
        run: |
          npm pack ./dist/npm/dsh-trace-extension --ignore-scripts --pack-destination dist/npm --json
          npm publish "dist/npm/dsh-trace-extension-${VERSION}.tgz" --tag "$DIST_TAG" --provenance --access public --ignore-scripts

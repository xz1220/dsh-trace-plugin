name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
        include:
          # setup-python does not distribute Python 3.9 for Ubuntu 26.04.
          - os: ubuntu-22.04
            python: '3.9'
          - os: macos-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python3 -m unittest discover -s tests -v
      - name: Synthetic performance sample
        run: python3 scripts/benchmark.py --out .cache/benchmarks/latest.json
      - name: Summarize synthetic performance
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path('.cache/benchmarks/latest.json').read_text())
          sample = report['synthetic']
          rows = ['| Metric | Value |', '| --- | --- |']
          for key in ('initialIndexMs', 'warmPageP50Ms', 'warmPageP95Ms', 'unchangedPollP50Ms', 'initialPayloadReads', 'warmExtraLogBytes'):
              rows.append(f'| {key} | {sample[key]} |')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('### Synthetic recording performance\n\n' + '\n'.join(rows) + '\n')
          if sample['initialPayloadReads'] or sample['warmExtraLogBytes']:
              raise SystemExit('Lazy reads or unchanged-poll I/O regressed')
          if report['largeBody']['detailBuilds'] != 1:
              raise SystemExit('Paged details were rebuilt')
          if report['threadPolling']['manifestReads']:
              raise SystemExit('Warm chat polling rescanned recording manifests')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-${{ matrix.os }}-py${{ matrix.python }}
          include-hidden-files: true
          path: .cache/benchmarks/latest.json

  node:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ['20.19', '22.22.3', '24']
        include:
          - os: macos-latest
            node: '22.22.3'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:node
      - name: Verify committed generated files
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22.22.3'
        run: npm run check:generated
      - run: npm run build
      - run: npm run test:npm

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.9.27'
          enable-cache: true
      - run: uv sync --frozen --group dev --python 3.13
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-and-plugin
          include-hidden-files: true
          path: |
            .cache/coverage/
            dist/

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-failure
          include-hidden-files: true
          path: |
            .cache/playwright/

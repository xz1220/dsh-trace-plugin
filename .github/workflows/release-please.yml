name: Prepare release PR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && (vars.ENABLE_RELEASE_PLEASE == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main
          # This workflow prepares a reviewable PR; maintainers publish tags.
          skip-github-release: true
      - name: Explain CI token requirement
        if: steps.release.outputs.prs_created == 'true'
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_PLEASE_TOKEN" ]; then
            echo '::notice::The built-in GITHUB_TOKEN does not trigger PR CI. Configure RELEASE_PLEASE_TOKEN or manually run CI on the release PR branch before merging.'
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.release.outputs.prs_created == 'true'
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.release.outputs.prs_created == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.release.outputs.prs_created == 'true'
        with:
          python-version: '3.12'
      - name: Build and validate the proposed version
        if: steps.release.outputs.prs_created == 'true'
        run: |
          npm ci
          npm run build
          npm test
          npm run check:generated
          npm run package
      - name: Include generated assets in the release PR
        if: steps.release.outputs.prs_created == 'true'
        env:
          RELEASE_BRANCH: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
        run: |
          git add src/version.js plugins/codex-dsh-trace/.codex-plugin/plugin.json plugins/codex-dsh-trace/server/_version.py plugins/codex-dsh-trace/server/trajectory-locales.json plugins/codex-dsh-trace/assets plugins/codex-dsh-trace/LICENSE plugins/codex-dsh-trace/THIRD_PARTY_NOTICES.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh generated release assets'
          git push origin HEAD:"$RELEASE_BRANCH"
